# Surge iOS 专用策略组片段
# 先在本地 [Proxy] 定义 HK[GLB]，例如 HK[GLB] = anytls, <你的公网地址>, <你的NAT公网端口>, password=<你的密码>, skip-cert-verify=true, reuse=false
# HK[GLB] 是私人 AnyTLS 节点，绝不应上传到 GitHub
# 将以下策略组复制到本地主配置的 [Proxy Group] 部分
# GlobalVPS 节点由 GitHub Raw URL 自动加载，无需在本地保存 100 多条节点定义
# 所有 GlobalVPS 节点均通过 HK[GLB] 访问

GlobalVPS = select, GV[常用], GV[亚洲], GV[欧洲], GV[北美洲], GV[南美洲], GV[非洲], GV[大洋洲], GV[专项服务], GV[全部国家地区]

GV[常用] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[(中国香港-HK|日本-JP|中国台湾-TW|新加坡-SG|美国-US|韩国-KR|英国-GB|澳大利亚-AU|ChatGPT-CGPT|Netflix US-NFX)\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[亚洲] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-(AF|AM|AZ|BH|BD|BT|BN|KH|CN|CY|GE|HK|IN|ID|JP|KZ|MY|OM|PH|SG|KR|TW|TH|TR|AE|VN)\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[欧洲] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-(AL|AD|AT|BY|BE|BA|BG|HR|CY|CZ|DK|EE|FI|FR|DE|GR|HU|IS|IE|IT|LV|LT|LU|MD|MC|NL|NO|PL|PT|RO|RU|RS|SK|SI|ES|SE|CH|UA|GB)\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[北美洲] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-(AW|BM|CA|KY|CR|GT|MX|PA|PR|US|BS)\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[南美洲] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-(AR|BO|BR|CL|CO|EC|PE|UY|VE)\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[非洲] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-(DZ|AO|EG|NG|ZA)\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[大洋洲] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-(AU|NZ)\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[专项服务] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-[A-Z0-9]{3,4}\\]$", update-interval=86400, underlying-proxy=HK[GLB]
GV[全部国家地区] = select, policy-path=https://raw.githubusercontent.com/csjcsl666/surge-globalvps/main/globalvps.list, policy-regex-filter="^GV\\[.*-[A-Z]{2}\\]$", update-interval=86400, underlying-proxy=HK[GLB]
